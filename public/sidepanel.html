<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Browser</title><link rel="stylesheet" href="panel.css"></head>
<body>
<div id="shell">
  <header data-layout-block="navigation"><div class="brand"><span class="brand-mark">◒</span><span>Custom</span></div><div class="window-tools"><button id="extensions-open" class="icon" title="擴充功能" aria-label="擴充功能">⬡</button><button id="focus-toggle" class="icon" title="進入全螢幕" aria-label="進入全螢幕">⛶</button><button id="settings-open" class="icon" title="設定與外觀" aria-label="設定與外觀">⚙</button></div></header>
  <button id="window-return" class="window-return" hidden>↙ 返回標準 Chrome 視窗</button>
  <section id="address-section" data-layout-block="address" aria-label="瀏覽導覽"><div class="navigation"><button data-nav="back" title="上一頁">←</button><button data-nav="forward" title="下一頁">→</button><button data-nav="reload" title="重新整理">↻</button></div><form id="address-form"><input id="address" aria-label="網址或搜尋" placeholder="輸入網址或搜尋…" autocomplete="off"><button id="copy-address" title="複製網址" aria-label="複製目前分頁網址" type="button">⧉</button></form></section>
  <button id="search-open" class="search-trigger"><span>⌕　搜尋與指令</span><kbd>Alt ⇧ K</kbd></button>
  <section class="space-heading"><div><h1 id="space-title">載入中…</h1></div><div class="space-actions"><button id="space-settings" class="color-settings" title="自訂 Space 顏色與外觀" aria-label="自訂 Space 顏色與外觀"></button><button id="add-menu" class="icon folder-add" title="新增資料夾" aria-label="新增資料夾"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h7l2 2h9v10H3z"/><path d="M12 11v5M9.5 13.5h5"/></svg></button></div></section>
  <main id="items" aria-label="分頁清單"></main>
  <button id="new-tab" class="new-tab">＋ 新增分頁</button>
  <div id="conflict-banner" hidden><button id="conflict-open"></button></div>
  <footer><div id="spaces" aria-label="Spaces"></div><div class="sync-line"><button id="sync-status" title="同步設定">● 本機模式</button><button id="sync-now" class="icon" title="立即同步">↻</button></div></footer>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="search-dialog" class="quick-dialog"><div class="quick-entry"><input id="search" placeholder="搜尋與指令" aria-label="搜尋與指令輸入" autocomplete="off"><button type="button" data-close="search-dialog" aria-label="關閉搜尋">×</button></div><div id="search-results"></div></dialog>
<dialog id="settings-dialog"><div class="dialog-head"><h2>設定與外觀</h2><button data-close="settings-dialog" aria-label="關閉設定">×</button></div>
  <h3>目前 Space</h3><form id="appearance-form"><label>名稱<input id="space-name" maxlength="200" required></label><div class="form-row"><label>起始顏色<input id="color-start" type="color"></label><label>結束顏色<input id="color-end" type="color"></label></div><label>漸層方向 <output id="angle-value"></output><input id="angle" type="range" min="0" max="360"></label><label>漸層不透明度 <output id="opacity-value"></output><input id="opacity" type="range" min="15" max="100"></label>
  <label>背景圖片（PNG / JPG / WebP，最大 5 MB）<input id="background-file" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="clear-background" class="subtle">移除背景圖片</button>
  <label>Space 圖示<input id="icon-file" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="clear-icon" class="subtle">移除自訂圖示</button><label class="check"><input id="space-custom-style" type="checkbox"> 使用個別字型與圓角</label><div id="space-style" class="style-grid"><label>字型<input id="space-font"></label><label>粗細<input id="space-weight" type="range" min="100" max="900" step="100"></label><label>大小<input id="space-size" type="range" min="9" max="32"></label><label>文字顏色<input id="space-text-color" type="color"></label><label>分頁圓角<input id="space-tab-radius" type="range" min="0" max="40"></label><label>Favicon 圓角<input id="space-favicon-radius" type="range" min="0" max="40"></label><label>網址列圓角<input id="space-address-radius" type="range" min="0" max="40"></label><label>Space 圓角<input id="space-space-radius" type="range" min="0" max="40"></label></div><button type="submit" class="primary">儲存外觀</button></form>
  <h3>瀏覽介面</h3><label class="check"><input id="show-address" type="checkbox"> 顯示側欄網址列</label><button id="extensions-settings">擴充功能</button><button id="fullscreen-settings">進入全螢幕</button><p class="hint" id="frame-status">F11 切換全螢幕。</p><button id="normal-window">返回標準視窗</button><button id="shortcuts">Chrome 快捷鍵設定</button>
  <h3>通用字型與圓角</h3><div id="global-style" class="style-grid"><label>字型<input id="global-font"></label><label>粗細<input id="global-weight" type="range" min="100" max="900" step="100"></label><label>大小<input id="global-size" type="range" min="9" max="32"></label><label>文字顏色<input id="global-text-color" type="color"></label><label>分頁圓角<input id="global-tab-radius" type="range" min="0" max="40"></label><label>Favicon 圓角<input id="global-favicon-radius" type="range" min="0" max="40"></label><label>網址列圓角<input id="global-address-radius" type="range" min="0" max="40"></label><label>Space 圓角<input id="global-space-radius" type="range" min="0" max="40"></label></div>
  <h3>Google Drive</h3><p id="account"></p><p id="sync-detail" class="hint"></p><div class="form-row"><button id="connect" class="primary">連線 Google Drive</button><button id="disconnect">中斷連線</button></div><button id="drive-folder" hidden>開啟 Drive 專用資料夾</button><p class="hint">新帳號獨立保存資料，不自動上傳本機舊資料。需要搬移時，先匯出，再於目標帳號匯入。</p>
  <h3>備份</h3><button id="export">匯出完整備份</button><label>匯入備份（合併保留衝突，最大 50 MB）<input id="import" type="file" accept="application/json,.json"></label>
  <h3>管理</h3><button id="delete-space" class="danger">刪除目前 Space（需先清空）</button><p class="hint">Custom Browser 0.2.0 · 本機優先 · 每 2 分鐘同步</p>
</dialog>
<dialog id="name-dialog" class="quick-dialog"><form id="name-form"><div class="quick-entry"><input id="name-input" maxlength="200" required aria-label="名稱"><button type="button" data-close="name-dialog" aria-label="取消">×</button></div></form></dialog>
<dialog id="menu-dialog"><div class="dialog-head"><h2 id="menu-title">項目操作</h2><button data-close="menu-dialog">×</button></div><div id="menu-actions"></div></dialog>
<dialog id="move-dialog"><form id="move-form"><div class="dialog-head"><h2>移動項目</h2><button type="button" data-close="move-dialog">×</button></div><label>Space<select id="move-space"></select></label><label>資料夾<select id="move-folder"></select></label><button class="primary" type="submit">移動</button></form></dialog>
<dialog id="conflict-dialog"><div class="dialog-head"><h2>選擇保留版本</h2><button data-close="conflict-dialog">×</button></div><p class="hint">同時修改的版本都已保留。選擇後會同步解決結果；原始記錄仍保留於備份。</p><div id="conflicts"></div></dialog>
<dialog id="extensions-dialog" class="action-dialog extensions-dialog"><div class="dialog-head"><h2>擴充功能</h2><button data-close="extensions-dialog">×</button></div><div class="extension-actions"><button id="extension-install" class="primary">安裝已解壓縮外掛</button><button id="extension-store">瀏覽 Chrome 線上應用程式商店</button></div><p class="hint">Electron 僅支援部分 Chrome Extension API；不相容外掛會顯示原因。</p><div id="extensions-list"></div></dialog>
<script type="module" src="panel.js"></script></body></html>
