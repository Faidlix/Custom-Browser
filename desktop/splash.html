<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Browser</title><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#222838;color:#eef2f8;font-family:"Segoe UI","Microsoft JhengHei",sans-serif}body{display:grid;place-items:center}.loading{display:grid;justify-items:center;gap:18px;animation:appear .18s ease-out}.mark{position:relative;width:64px;height:64px;border:3px solid #91a9d8;border-radius:50%;box-sizing:border-box;overflow:hidden}.mark::before{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:32px;background:#6f85b4}.mark::after{content:"";position:absolute;inset:-9px;border:3px solid transparent;border-top-color:#d8c5ff;border-radius:50%;animation:spin .8s linear infinite}.text{font-size:13px;letter-spacing:.08em;color:#c4ccda}@keyframes spin{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.mark::after{animation:none}.loading{animation:none}}
</style></head><body><div class="loading" role="status" aria-label="正在啟動 Custom Browser"><div class="mark" aria-hidden="true"></div><div class="text">正在啟動</div></div></body></html>
